<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Game</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <!-- Quiz Container -->
        <div id="quizContainer" class="quiz-container">
            <h1>🎯 Quiz Game</h1>
            <p class="subtitle">Test your JavaScript knowledge!</p>

            <!-- Progress Bar -->
            <div class="progress-section">
                <div class="progress-bar">
                    <div id="progressFill" class="progress-fill"></div>
                </div>
                <div class="progress-text">
                    <span id="questionNumber">1</span> / <span id="totalQuestions">10</span>
                </div>
            </div>

            <!-- Question Section -->
            <div id="questionSection" class="question-section">
                <div class="question-number">Question <span id="currentQuestion">1</span></div>
                <h2 id="questionText" class="question-text">Question will appear here</h2>

                <!-- Answer Options -->
                <div id="answerOptions" class="answer-options">
                    <!-- Options will be generated -->
                </div>

                <!-- Navigation Buttons -->
                <div class="navigation">
                    <button id="prevBtn" class="btn btn-nav btn-prev" disabled>
                        ❮ Previous
                    </button>
                    <button id="nextBtn" class="btn btn-nav btn-next">
                        Next ❯
                    </button>
                    <button id="submitBtn" class="btn btn-nav btn-submit hidden">
                        Submit Quiz ✓
                    </button>
                </div>
            </div>

            <!-- Question Counter -->
            <div class="question-counter">
                <span id="answeredCount">0</span> of <span id="totalForCounter">10</span> answered
            </div>
        </div>

        <!-- Results Screen -->
        <div id="resultsContainer" class="results-container hidden">
            <div class="results-content">
                <h1>🎉 Quiz Complete!</h1>

                <div class="score-circle">
                    <div class="score-text">
                        <span class="score-value" id="scoreValue">0</span>
                        <span class="score-label">/ 10</span>
                    </div>
                </div>

                <div class="score-message">
                    <h2 id="scoreMessage">Great Job!</h2>
                    <p id="scoreDescription">You got most questions right!</p>
                </div>

                <div class="result-stats">
                    <div class="stat">
                        <span class="stat-label">Correct Answers:</span>
                        <span class="stat-value" id="correctAnswers">0</span>
                    </div>
                    <div class="stat">
                        <span class="stat-label">Wrong Answers:</span>
                        <span class="stat-value" id="wrongAnswers">0</span>
                    </div>
                    <div class="stat">
                        <span class="stat-label">Percentage:</span>
                        <span class="stat-value" id="percentage">0%</span>
                    </div>
                </div>

                <!-- Answer Review -->
                <div id="answerReview" class="answer-review">
                    <h3>📋 Answer Review</h3>
                    <div id="reviewList" class="review-list">
                        <!-- Review items will be generated -->
                    </div>
                </div>

                <!-- Action Buttons -->
                <div class="result-actions">
                    <button id="restartBtn" class="btn btn-restart">
                        🔄 Restart Quiz
                    </button>
                    <button id="printBtn" class="btn btn-print">
                        🖨️ Print Results
                    </button>
                </div>
            </div>
        </div>

        <!-- Notification -->
        <div id="notification" class="notification hidden"></div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="script.js"></script>
</body>

</html>
