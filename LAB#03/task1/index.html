<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Task 1 – Student Management System</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: #e2e8f0;
            padding: 2rem 1rem;
        }

        /* ── Header ────────────────────────────────── */
        header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        header h1 {
            font-size: 2.2rem;
            font-weight: 700;
            background: linear-gradient(90deg, #f97316, #eab308);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        header p {
            margin-top: 0.5rem;
            color: #94a3b8;
            font-size: 0.95rem;
        }

        /* ── Stats Bar ─────────────────────────────── */
        .stats-bar {
            max-width: 700px;
            margin: 0 auto 2rem;
            display: flex;
            justify-content: center;
            gap: 1.5rem;
            flex-wrap: wrap;
        }

        .stat-item {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 1rem 1.8rem;
            text-align: center;
            backdrop-filter: blur(10px);
            min-width: 140px;
        }

        .stat-item .number {
            font-size: 1.8rem;
            font-weight: 700;
            color: #f97316;
        }

        .stat-item .label {
            font-size: 0.8rem;
            color: #94a3b8;
            margin-top: 0.2rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* ── Container ─────────────────────────────── */
        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        .section-title {
            font-size: 1.15rem;
            margin-bottom: 1.2rem;
            color: #a78bfa;
            font-weight: 600;
        }

        /* ── Student Cards ─────────────────────────── */
        #students-container {
            display: grid;
            gap: 1.2rem;
        }

        .student-card {
            background: linear-gradient(145deg, rgba(167, 139, 250, 0.08), rgba(139, 92, 246, 0.04));
            border: 1px solid rgba(167, 139, 250, 0.15);
            border-radius: 16px;
            padding: 1.5rem 1.8rem;
            display: flex;
            align-items: flex-start;
            gap: 1.4rem;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .student-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 35px rgba(139, 92, 246, 0.2);
        }

        .avatar {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: linear-gradient(135deg, #f97316, #eab308);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            font-weight: 700;
            color: #1e1b4b;
            flex-shrink: 0;
        }

        .card-body {
            flex: 1;
        }

        .card-body .name {
            font-size: 1.2rem;
            font-weight: 600;
            color: #f1f5f9;
            margin-bottom: 0.3rem;
        }

        .card-body .meta {
            color: #94a3b8;
            font-size: 0.85rem;
            margin-bottom: 0.7rem;
        }

        .card-body .meta strong {
            color: #a78bfa;
            font-weight: 500;
        }

        .courses-list {
            display: flex;
            flex-wrap: wrap;
            gap: 0.4rem;
        }

        .course-badge {
            background: rgba(234, 179, 8, 0.12);
            border: 1px solid rgba(234, 179, 8, 0.25);
            color: #eab308;
            font-size: 0.75rem;
            padding: 0.25rem 0.7rem;
            border-radius: 20px;
            font-weight: 500;
        }

        /* ── Footer ────────────────────────────────── */
        footer {
            text-align: center;
            margin-top: 3rem;
            color: #475569;
            font-size: 0.8rem;
        }

        /* ── Responsive ────────────────────────────── */
        @media (max-width: 600px) {
            .student-card {
                flex-direction: column;
                align-items: center;
                text-align: center;
            }

            .courses-list {
                justify-content: center;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>🎓 Student Management System</h1>
        <p>Task 1 — ES6 Classes, let/const & Template Literals</p>
    </header>

    <!-- Stats -->
    <div class="stats-bar" id="stats-bar"></div>

    <div class="container">
        <h2 class="section-title">🧑‍🎓 All Students</h2>
        <div id="students-container"></div>
    </div>

    <footer>&copy; 2026 &mdash; LAB #03 | Task 1</footer>

    <!--  External JavaScript -->
    <script src="script.js"></script>

</body>

</html>
