<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 5 - Product Manager with Map</title>
    <style>
        /* ===== Global Reset & Base ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 40px 20px;
            color: #e0e0e0;
        }

        /* ===== Card Container ===== */
        .container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 40px;
            max-width: 720px;
            width: 100%;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }

        h1 {
            text-align: center;
            font-size: 1.9rem;
            margin-bottom: 6px;
            background: linear-gradient(90deg, #f472b6, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            text-align: center;
            font-size: 0.95rem;
            color: #9ca3af;
            margin-bottom: 30px;
        }

        /* ===== Controls Section ===== */
        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 24px;
            align-items: center;
        }

        .controls input {
            flex: 1;
            min-width: 140px;
            padding: 12px 16px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.07);
            color: #e0e0e0;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.3s;
        }

        .controls input::placeholder {
            color: #6b7280;
        }

        .controls input:focus {
            border-color: #818cf8;
        }

        /* ===== Buttons ===== */
        .btn {
            padding: 11px 20px;
            font-size: 0.88rem;
            font-weight: 600;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            color: #fff;
            transition: transform 0.2s, box-shadow 0.2s;
            white-space: nowrap;
        }

        .btn:hover {
            transform: translateY(-2px);
        }

        .btn-search {
            background: linear-gradient(135deg, #6366f1, #818cf8);
        }

        .btn-search:hover {
            box-shadow: 0 4px 18px rgba(99, 102, 241, 0.5);
        }

        .btn-delete {
            background: linear-gradient(135deg, #ef4444, #f87171);
        }

        .btn-delete:hover {
            box-shadow: 0 4px 18px rgba(239, 68, 68, 0.5);
        }

        .btn-show {
            background: linear-gradient(135deg, #059669, #34d399);
        }

        .btn-show:hover {
            box-shadow: 0 4px 18px rgba(5, 150, 105, 0.5);
        }

        .btn-total {
            background: linear-gradient(135deg, #d97706, #fbbf24);
        }

        .btn-total:hover {
            box-shadow: 0 4px 18px rgba(217, 119, 6, 0.5);
        }

        /* ===== Status / Feedback ===== */
        #statusMsg {
            text-align: center;
            font-size: 0.92rem;
            min-height: 26px;
            margin-bottom: 20px;
            font-weight: 500;
        }

        .msg-success {
            color: #34d399;
        }

        .msg-warn {
            color: #fbbf24;
        }

        .msg-error {
            color: #f87171;
        }

        .msg-info {
            color: #818cf8;
        }

        /* ===== Product Table ===== */
        .table-wrap {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 4px;
        }

        thead th {
            background: rgba(129, 140, 248, 0.2);
            color: #c4b5fd;
            padding: 12px 14px;
            text-align: left;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        thead th:first-child {
            border-radius: 10px 0 0 0;
        }

        thead th:last-child {
            border-radius: 0 10px 0 0;
        }

        tbody td {
            padding: 12px 14px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            font-size: 0.93rem;
        }

        tbody tr {
            transition: background 0.2s;
        }

        tbody tr:hover {
            background: rgba(255, 255, 255, 0.04);
        }

        .price-cell {
            color: #34d399;
            font-weight: 600;
        }

        .category-tag {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            background: rgba(244, 114, 182, 0.15);
            color: #f472b6;
            border: 1px solid rgba(244, 114, 182, 0.25);
        }

        /* ===== Total Badge ===== */
        .total-badge {
            text-align: center;
            font-size: 1rem;
            padding: 14px;
            border-radius: 10px;
            background: rgba(251, 191, 36, 0.1);
            border: 1px solid rgba(251, 191, 36, 0.25);
            color: #fbbf24;
            font-weight: 600;
            margin-top: 20px;
            display: none;
        }

        /* ===== Search Result Card ===== */
        .search-card {
            background: rgba(99, 102, 241, 0.1);
            border: 1px solid rgba(99, 102, 241, 0.25);
            border-radius: 12px;
            padding: 18px 22px;
            margin-top: 4px;
            animation: fadeIn 0.35s ease;
        }

        .search-card p {
            margin-bottom: 6px;
            font-size: 0.95rem;
        }

        .search-card strong {
            color: #c4b5fd;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(6px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>🛒 Product Manager</h1>
        <p class="subtitle">Managing products with the ES6 Map object</p>

        <!-- Controls: input + action buttons -->
        <div class="controls">
            <input type="number" id="productIdInput" placeholder="Enter Product ID…" min="1" />
            <button class="btn btn-search" id="searchBtn">🔍 Search</button>
            <button class="btn btn-delete" id="deleteBtn">🗑️ Delete</button>
            <button class="btn btn-show" id="showAllBtn">📋 Show All</button>
            <button class="btn btn-total" id="totalBtn">📊 Total</button>
        </div>

        <!-- Status / feedback message -->
        <p id="statusMsg"></p>

        <!-- Dynamic output area -->
        <div id="outputArea"></div>

        <!-- Total badge (shown on demand) -->
        <div class="total-badge" id="totalBadge"></div>
    </div>

    <!-- External JavaScript -->
    <script src="script.js"></script>
</body>

</html>
