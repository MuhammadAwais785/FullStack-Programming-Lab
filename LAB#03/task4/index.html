<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 4 - Duplicate Course Prevention with Set</title>
    <style>
        /* ===== Global Styles ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #e0e0e0;
        }

        /* ===== Card Container ===== */
        .container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 40px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }

        h1 {
            text-align: center;
            font-size: 1.8rem;
            margin-bottom: 8px;
            background: linear-gradient(90deg, #34d399, #60a5fa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            text-align: center;
            font-size: 0.95rem;
            color: #9ca3af;
            margin-bottom: 28px;
        }

        /* ===== Input Row ===== */
        .input-row {
            display: flex;
            gap: 10px;
            margin-bottom: 24px;
        }

        .input-row input {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.07);
            color: #e0e0e0;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.3s;
        }

        .input-row input::placeholder {
            color: #6b7280;
        }

        .input-row input:focus {
            border-color: #34d399;
        }

        .input-row button {
            padding: 12px 22px;
            font-size: 0.95rem;
            font-weight: 600;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            background: linear-gradient(135deg, #059669, #3b82f6);
            color: #fff;
            transition: transform 0.2s, box-shadow 0.2s;
            white-space: nowrap;
        }

        .input-row button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 20px rgba(5, 150, 105, 0.5);
        }

        /* ===== Status Message ===== */
        #statusMsg {
            text-align: center;
            font-size: 0.9rem;
            min-height: 24px;
            margin-bottom: 18px;
            font-weight: 500;
            transition: color 0.3s;
        }

        .status-added {
            color: #34d399;
        }

        .status-dup {
            color: #f59e0b;
        }

        /* ===== Course List ===== */
        h2 {
            font-size: 1.1rem;
            margin-bottom: 12px;
            color: #c4b5fd;
        }

        #courseList {
            list-style: none;
            padding: 0;
            margin-bottom: 20px;
        }

        #courseList li {
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            padding: 12px 18px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 12px;
            animation: fadeIn 0.35s ease forwards;
            opacity: 0;
        }

        #courseList li .num {
            background: linear-gradient(135deg, #059669, #3b82f6);
            color: #fff;
            font-weight: 700;
            font-size: 0.8rem;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        @keyframes fadeIn {
            to {
                opacity: 1;
            }
        }

        /* ===== Total Badge ===== */
        .total-badge {
            text-align: center;
            font-size: 1rem;
            padding: 12px;
            border-radius: 10px;
            background: rgba(52, 211, 153, 0.1);
            border: 1px solid rgba(52, 211, 153, 0.25);
            color: #34d399;
            font-weight: 600;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>📚 Course Registration</h1>
        <p class="subtitle">Preventing duplicates with the ES6 Set object</p>

        <!-- Input to add courses dynamically -->
        <div class="input-row">
            <input type="text" id="courseInput" placeholder="Enter course name…" />
            <button id="addBtn">+ Add</button>
        </div>

        <!-- Status message (added / duplicate) -->
        <p id="statusMsg"></p>

        <!-- Registered courses displayed here -->
        <h2>Registered Courses</h2>
        <ul id="courseList"></ul>

        <!-- Total unique courses -->
        <div class="total-badge" id="totalBadge">Total Unique Courses: 0</div>
    </div>

    <!-- External JavaScript file -->
    <script src="script.js"></script>
</body>

</html>
